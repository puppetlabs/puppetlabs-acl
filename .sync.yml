---
".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
.rubocop.yml:
  include_todos: true
Gemfile:
  optional:
    ":development":
    - gem: net-telnet
  # MODULES-11712: pin puppetlabs_spec_helper and puppet_litmus above pdk-templates'
  # own defaults (>= 8.0 and ~> 2.5 respectively), which are loose enough for a
  # scheduled `pdk update` to silently revert this PR: puppetlabs_spec_helper 8.0.0
  # still pins puppet-lint ~> 4.0 (conflicts with voxpupuli-puppet-lint-plugins ~> 7.0,
  # needed for Puppet 9), and puppet_litmus below 2.8.0 lacks the Puppet 9 collection
  # support matrix_from_metadata_v3 needs to generate this module's Puppet 9 Spec lane.
  overrides:
    - gem: 'puppetlabs_spec_helper'
      version: '~> 9.0'
    - gem: 'puppet_litmus'
      version: '~> 2.8'
spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
# MODULES-11712: ci.yml and nightly.yml are maintained by hand because they carry
# Puppet 9 customisations that pdk-templates cannot express -- the `ruby_version`
# input (no such key in the templates). Leaving them managed means the scheduled
# `pdk update` PR silently reverts Puppet 9 support. acceptance_flags below is
# kept in step with the hand-written `flags:` so these can go back to template
# management once pdk-templates supports that input.
.github/workflows/ci.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
.github/workflows/nightly.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
